<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden}
  .bg{
    width:100%;height:100vh;
    background:#000;
    display:flex;justify-content:center;align-items:center;
    position:relative;
  }
  img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  button{
    position:absolute;
    bottom:25px;left:50%;transform:translateX(-50%);
    padding:13px 24px;border:none;border-radius:30px;
    background:#fff;color:#000;font-weight:bold;font-size:14px;
    cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.5);
    white-space:nowrap;z-index:10;
  }
</style>
</head>
<body>
<div class="bg">
  <img src="pelangi.jpg">
  <button id="btnLagu" onclick="playLagu()">▶️ Putar Lagu</button>
  <audio id="lagu" src="lagu.mp3" loop></audio>
</div>

<script>
  var isPlay = false;
  var audio = document.getElementById('lagu');
  function playLagu(){
    var btn = document.getElementById('btnLagu');
    if(!isPlay){
      audio.play();
      btn.innerText = "⏸️ Pause Lagu";
      isPlay = true;
    } else {
      audio.pause();
      btn.innerText = "▶️ Putar Lagu";
      isPlay = false;
    }
  }
</script>
</body>
</html>
