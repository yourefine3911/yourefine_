<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yourefine._</title>
<link rel="icon" href="data:image/svg+xml,[STRIPPED]">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:sans-serif}
  .bg{width:100%;height:100vh;background:#000;display:flex;justify-content:center;align-items:center;position:relative}
  img{width:100%;height:100%;object-fit:contain}
  #nama{
    position:absolute;top:15px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:15px;font-weight:bold;letter-spacing:1px;
    text-shadow:0 2px 8px #000;z-index:10;opacity:0.9;
  }
  #lirik{
    position:absolute;top:24%;left:16px;
    width:78%;text-align:left;
    color:#fff;font-size:14px;font-weight:bold;font-style:italic;line-height:1.5;
    text-shadow:0 2px 10px #000,0 0 15px #ff9ec4;z-index:10;
    white-space:pre-line;min-height:100px;
  }
  #lirik::after{
    content:'|';animation:kedip 0.8s infinite;margin-left:2px;color:#ff9ec4;
  }
  @keyframes kedip{0%,100%{opacity:1}50%{opacity:0}}
  button{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 24px;border:none;border-radius:30px;background:#fff;color:#000;font-weight:bold;font-size:14px;cursor:pointer;z-index:10}
</style>
</head>
<body>
<div class="bg">
  <img src="pelangi.jpg">
  <div id="nama">yourefine._</div>
  <div id="lirik"></div>
  <button id="btnLagu" onclick="playLagu()">▶️ Putar Lagu</button>
  <audio id="lagu" src="lagu.mp3" loop></audio>
</div>
<script>
  var isPlay = false;
  var audio = document.getElementById('lagu');
  var teks = document.getElementById('lirik');
  var lirik = [
    [26, "Dimana kan kusimpan\nSemua harapan ini\nDi saat kutemui\nJalan yang tak bertepi"],
    [51, "Seiring redup hati\nSelimuti senyummu\nTak mampu ku bergerak\nDi sudut sempit ini"],
    [77, "Jadilah pelita di kala\nRedup hatimu\nDi saat tak mampu\nlagi diriku terangi"],
    [95, "Gelapmu seperti dulu\nTeruslah melangkah\nWalau kini ku tak berjalan\nDisampingmu"],
    [116, "Hingga kau pun berlabuh\nDi akhir ujung jalanmu"],
    [123, "Sampai nanti\nKelak esok kan kembali\nIni tentang kita\nTentang bagaimana\nCara kita mampu"],
    [144, "Melangkah tanpa\nAlasan yang sama"],
    [148, "Dan sadari\nKini nafasmu pun\nTak seirama denyut nadiku\nAmat dalam kuterjatuh"],
    [168, "Hingga kau pun berlabuh\nDi akhir ujung jalanmu"],
    [199, "Pahami setiap langkah\nDari waktu yang t'lah tersisa\nAkan berjuta kata tak bermakna"],
    [211, "Bungkam semua ambisi\nWalaupun kini ku tak lagi\nMenemani kelam ini"],
    [244, "Sampai nanti\nKelak esok kan kembali\nIni tentang kita\nTentang bagaimana\nCara kita mampu"],
    [265, "melangkah tanpa\nAlasan yang sama"],
    [269, "Dan sadari\nKini nafasmu pun\nTak seirama denyut nadiku\nAmat dalam kuterjatuh"],
    [288, "Hingga kau pun berlabuh\nDi akhir ujung jalanmu"],
    [300, "TERIMAKASIH"]
  ];

  var lirikSekarang = -1;
  var ketikInterval = null;

  function ketikPerHuruf(teksLengkap){
    // Berhentiin ketikan lama kalo ada
    if(ketikInterval) clearInterval(ketikInterval);
    var i = 0;
    teks.innerText = "";
    ketikInterval = setInterval(function(){
      if(i < teksLengkap.length){
        teks.innerText += teksLengkap[i];
        i++;
      } else {
        clearInterval(ketikInterval);
      }
    }, 35); // 35ms per huruf, makin kecil makin cepet
  }

  function playLagu(){
    var btn = document.getElementById('btnLagu');
    if(!isPlay){ audio.play(); btn.innerText="⏸️ Pause Lagu"; isPlay=true; }
    else{ audio.pause(); btn.innerText="▶️ Putar Lagu"; isPlay=false; }
  }

  audio.ontimeupdate = function(){
    var t = audio.currentTime;
    var index = -1;
    for(var i=0;i<lirik.length;i++){ if(t >= lirik[i][0]) index = i; }
    if(index !== lirikSekarang){
      lirikSekarang = index;
      if(index === -1){
        teks.innerText = "";
      } else {
        ketikPerHuruf(lirik[index][1]);
      }
    }
  }
</script>
</body>
</html>
