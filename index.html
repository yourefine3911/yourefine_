<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yourefine._</title>
<link rel="icon" href="data:image/svg+xml,[STRIPPED]">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:sans-serif}
  .bg{width:100%;height:100vh;background:#000;display:flex;justify-content:center;align-items:center;position:relative}
  img{width:100%;height:100%;object-fit:contain}
  #nama{
    position:absolute;top:15px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:15px;font-weight:bold;letter-spacing:1px;
    text-shadow:0 2px 8px #000;z-index:10;opacity:0.9;
  }
  #lirik{
    position:absolute;top:24%;left:16px;
    width:78%;text-align:left;
    color:#fff;font-size:14px;font-weight:bold;font-style:italic;line-height:1.5;
    text-shadow:0 2px 10px #000,0 0 15px #ff9ec4;z-index:10
  }
  button{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 24px;border:none;border-radius:30px;background:#fff;color:#000;font-weight:bold;font-size:14px;cursor:pointer;z-index:10}
</style>
</head>
<body>
<div class="bg">
  <img src="pelangi.jpg">
  <div id="nama">yourefine._</div>
  <div id="lirik"></div>
  <button id="btnLagu" onclick="playLagu()">▶️ Putar Lagu</button>
  <audio id="lagu" src="lagu.mp3" loop></audio>
</div>
<script>
  var isPlay = false;
  var audio = document.getElementById('lagu');
  var teks = document.getElementById('lirik');
  var lirik = [
    [26, "Di mana kan ku simpan\nSemua harapan ini"],
    [34, "Di saat ku temui\nJalan yang tak bertepi"],
    [42, "Seiring redup hati\nSelimuti senyummu"],
    [50, "Tak mampu ku bergerak\nDi sudut sempit ini"],
    [58, "Jadilah pelita\nDi kala redup hatimu"],
    [66, "Di saat tak mampu lagi diriku\nTerangi gelapmu seperti dulu"],
    [74, "Teruslah melangkah walau kini\nKu tak berjalan di sampingmu"],
    [82, "Hingga kau pun berlabuh\nDi arti ujung jalanmu"],
    [90, "Sampai nanti..."],
    [94, "Kelak esok kan kembali\nIni tentang kita"],
    [102, "Tentang bagaimana cara\nKita mampu melangkah"],
    [110, "Tanpa alasan yang sama"],
    [118, "Dan sadari..."],
    [122, "Kini nafasmu pun tak\nSeirama denyut nadiku"],
    [130, "Amat dalam ku terjatuh"],
    [138, "Pahami setiap langkah\nDari waktu yang t'lah tersisa"],
    [146, "Bungkam semua ambisi\nWalaupun kini ku tak lagi menemani kelam ini"],
    [154, "Sampai nanti..."],
    [162, "Kelak esok kan kembali\nIni tentang kita"],
    [194, "Sampai nanti"]
  ];
  function playLagu(){
    var btn = document.getElementById('btnLagu');
    if(!isPlay){ audio.play(); btn.innerText="⏸️ Pause Lagu"; isPlay=true; }
    else{ audio.pause(); btn.innerText="▶️ Putar Lagu"; isPlay=false; }
  }
  audio.ontimeupdate = function(){
    var t = audio.currentTime;
    var tampil = "";
    for(var i=0;i<lirik.length;i++){ if(t >= lirik[i][0]) tampil = lirik[i][1]; }
    teks.innerText = tampil;
  }
</script>
</body>
</html>
